upstream dify_web_upstream {
    server dify-web:3000;
}

upstream dify_api_upstream {
    server dify-api:5001;
}

upstream tools_api_upstream {
    server tools-api:8080;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 100M;

    # Headers de Segurança HTTP
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 1. Roteamento da API e Console do Dify
    location ~ ^/(console/api|api|v1|files) {
        proxy_pass http://dify_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 2. Roteamento das Ferramentas Corporativas (Custom Tools)
    location /tools/ {
        rewrite ^/tools/(.*) /$1 break;
        proxy_pass http://tools_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Frontend Web do Dify (Next.js)
    location / {
        proxy_pass http://dify_web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
