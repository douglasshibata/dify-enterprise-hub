version: '3.8'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    internal: true # Isolamento total contra acessos externos não autenticados
    driver: bridge

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  app_storage:

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: dify_enterprise_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - dify-web
      - dify-api
      - tools-api
    networks:
      - frontend_net

  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify_enterprise_web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: ''
      APP_API_URL: ''
    networks:
      - frontend_net

  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify_enterprise_api
    restart: unless-stopped
    environment:
      MODE: api
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY:?Obrigatorio definir SECRET_KEY}
      DB_USERNAME: ${DB_USER:-dify}
      DB_PASSWORD: ${DB_PASSWORD:?Obrigatorio definir DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-dify_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Obrigatorio definir REDIS_PASSWORD}
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      SANDBOX_ENABLE: "true"
      SANDBOX_URL: http://dify-sandbox:8194
      SSRF_PROXY_HTTP_URL: http://ssrf-proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf-proxy:3128
    volumes:
      - app_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - frontend_net
      - backend_net

  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify_enterprise_worker
    restart: unless-stopped
    environment:
      MODE: worker
      LOG_LEVEL: INFO
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_USERNAME: ${DB_USER:-dify}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-dify_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - app_storage:/app/api/storage
    depends_on:
      - dify-api
    networks:
      - backend_net

  dify-sandbox:
    image: langgenius/dify-sandbox:latest
    container_name: dify_enterprise_sandbox
    restart: unless-stopped
    environment:
      API_KEY: ${SANDBOX_API_KEY:?Obrigatorio definir SANDBOX_API_KEY}
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  tools-api:
    build:
      context: ./tools_api
      dockerfile: Dockerfile
    container_name: dify_enterprise_tools
    restart: unless-stopped
    environment:
      SERVICE_API_KEY: ${TOOLS_API_KEY:?Obrigatorio definir TOOLS_API_KEY}
    networks:
      - frontend_net
      - backend_net

  postgres:
    image: postgres:15-alpine
    container_name: dify_enterprise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dify}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-dify_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    container_name: dify_enterprise_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: dify_enterprise_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - backend_net

  ssrf-proxy:
    image: ubuntu/squid:edge
    container_name: dify_enterprise_ssrf_proxy
    restart: unless-stopped
    networks:
      - backend_net
